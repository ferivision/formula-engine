name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: go vet
        run: make vet

      - name: gofmt check
        run: make fmt-check

      - name: build
        run: make build

      - name: test
        run: make test

      - name: test (race)
        run: make test-race
